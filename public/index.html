<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="h-screen w-screen flex flex-col justify-between text-slate-100 overflow-hidden">

    <!-- Desktop -->
    <div id="desktop" class="flex-1 p-6 grid grid-cols-2 sm:grid-cols-6 gap-6 content-start z-0" onclick="closeStartMenu()">
        <div onclick="openApp('browserWindow')" class="app-icon cursor-pointer flex flex-col items-center">
            <div class="icon-box w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-globe"></i></div>
            <span class="text-xs mt-2 font-medium">Browser</span>
        </div>
        <div onclick="openApp('filesWindow'); loadFiles();" class="app-icon cursor-pointer flex flex-col items-center">
            <div class="icon-box w-14 h-14 bg-amber-500 rounded-2xl flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-folder-open"></i></div>
            <span class="text-xs mt-2 font-medium">Files</span>
        </div>
        <div onclick="openApp('notepadWindow')" class="app-icon cursor-pointer flex flex-col items-center">
            <div class="icon-box w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-note-sticky"></i></div>
            <span class="text-xs mt-2 font-medium">Notepad</span>
        </div>
        <div onclick="openApp('calcWindow')" class="app-icon cursor-pointer flex flex-col items-center">
            <div class="icon-box w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-calculator"></i></div>
            <span class="text-xs mt-2 font-medium">Calculator</span>
        </div>
        <div onclick="openApp('settingsWindow')" class="app-icon cursor-pointer flex flex-col items-center">
            <div class="icon-box w-14 h-14 bg-slate-700 rounded-2xl flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-gear"></i></div>
            <span class="text-xs mt-2 font-medium">Settings</span>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="startMenu" class="hidden absolute bottom-16 left-3 w-80 h-96 rounded-2xl z-50 p-4 bg-slate-900/90 backdrop-blur-xl border border-white/10 flex flex-col shadow-2xl">
        <div class="flex items-center space-x-3 pb-4 border-b border-white/10">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold"><i class="fa-solid fa-cubes"></i></div>
            <div>
                <h4 class="text-sm font-semibold">WebOS Pro</h4>
                <p class="text-[10px] text-slate-400">Virtual Workstation</p>
            </div>
        </div>
        <div class="flex-1 py-3 grid grid-cols-3 gap-2">
            <button onclick="openApp('browserWindow'); closeStartMenu();" class="p-2 hover:bg-white/10 rounded-xl flex flex-col items-center"><i class="fa-solid fa-globe text-indigo-400 text-xl"></i><span class="text-xs mt-1">Browser</span></button>
            <button onclick="openApp('filesWindow'); loadFiles(); closeStartMenu();" class="p-2 hover:bg-white/10 rounded-xl flex flex-col items-center"><i class="fa-solid fa-folder-open text-amber-400 text-xl"></i><span class="text-xs mt-1">Files</span></button>
            <button onclick="openApp('notepadWindow'); closeStartMenu();" class="p-2 hover:bg-white/10 rounded-xl flex flex-col items-center"><i class="fa-solid fa-note-sticky text-emerald-400 text-xl"></i><span class="text-xs mt-1">Notepad</span></button>
            <button onclick="openApp('calcWindow'); closeStartMenu();" class="p-2 hover:bg-white/10 rounded-xl flex flex-col items-center"><i class="fa-solid fa-calculator text-blue-400 text-xl"></i><span class="text-xs mt-1">Calc</span></button>
            <button onclick="openApp('settingsWindow'); closeStartMenu();" class="p-2 hover:bg-white/10 rounded-xl flex flex-col items-center"><i class="fa-solid fa-gear text-slate-300 text-xl"></i><span class="text-xs mt-1">Settings</span></button>
        </div>
    </div>

    <!-- BROWSER WINDOW -->
    <div id="browserWindow" class="window hidden absolute top-10 left-12 w-[850px] h-[520px] bg-slate-900/90 backdrop-blur-xl rounded-xl flex flex-col overflow-hidden shadow-2xl z-10 border border-white/10">
        <div class="h-10 bg-slate-900/80 border-b border-white/10 flex items-center justify-between px-4 select-none cursor-move" onmousedown="startDrag(event, 'browserWindow')">
            <div class="flex items-center space-x-2">
                <div onclick="closeApp('browserWindow')" class="w-3 h-3 rounded-full bg-rose-500 cursor-pointer"></div>
                <div onclick="toggleFullscreen('browserWindow')" class="w-3 h-3 rounded-full bg-emerald-500 cursor-pointer"></div>
                <span class="text-xs font-semibold text-slate-300 ml-2">Web Browser</span>
            </div>
        </div>
        <div class="bg-slate-900/50 p-2 border-b border-white/10 flex items-center space-x-2">
            <form onsubmit="loadUrl(event)" class="flex-1 flex">
                <input id="urlInput" type="text" placeholder="Search or enter URL (e.g. https://crazygames.com)" class="w-full bg-slate-950 border border-white/10 rounded-lg px-4 py-1.5 text-sm text-white focus:outline-none">
            </form>
            <button onclick="loadUrlBtn()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg text-sm">Go</button>
        </div>
        <!-- Pointed to proxy route for client-side service worker handling -->
        <iframe id="browserFrame" src="about:blank" class="w-full flex-1 border-none bg-white"></iframe>
    </div>

    <!-- FILES WINDOW -->
    <div id="filesWindow" class="window hidden absolute top-16 left-24 w-[650px] h-[400px] bg-slate-900/90 backdrop-blur-xl rounded-xl flex flex-col overflow-hidden shadow-2xl z-10 border border-white/10">
        <div class="h-10 bg-slate-900/80 border-b border-white/10 flex items-center justify-between px-4 select-none cursor-move" onmousedown="startDrag(event, 'filesWindow')">
            <div class="flex items-center space-x-2">
                <div onclick="closeApp('filesWindow')" class="w-3 h-3 rounded-full bg-rose-500 cursor-pointer"></div>
                <span class="text-xs font-semibold text-slate-300 ml-2">File Manager</span>
            </div>
            <button onclick="createNewFilePrompt()" class="bg-amber-600 hover:bg-amber-500 text-white px-2.5 py-1 rounded text-xs">New File</button>
        </div>
        <div id="fileGrid" class="flex-1 p-6 grid grid-cols-4 gap-4 overflow-y-auto"></div>
    </div>

    <!-- NOTEPAD WINDOW -->
    <div id="notepadWindow" class="window hidden absolute top-20 left-36 w-[550px] h-[360px] bg-slate-900/90 backdrop-blur-xl rounded-xl flex flex-col overflow-hidden shadow-2xl z-10 border border-white/10">
        <div class="h-10 bg-slate-900/80 border-b border-white/10 flex items-center justify-between px-4 select-none cursor-move" onmousedown="startDrag(event, 'notepadWindow')">
            <div class="flex items-center space-x-2">
                <div onclick="closeApp('notepadWindow')" class="w-3 h-3 rounded-full bg-rose-500 cursor-pointer"></div>
                <span class="text-xs font-semibold text-slate-300 ml-2">Notepad</span>
            </div>
            <button onclick="saveCurrentNote()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded text-xs">Save</button>
        </div>
        <textarea id="notepadContent" class="flex-1 bg-slate-950/60 p-4 text-sm text-slate-200 resize-none border-none focus:outline-none font-mono" placeholder="Write something..."></textarea>
    </div>

    <!-- CALCULATOR WINDOW -->
    <div id="calcWindow" class="window hidden absolute top-24 left-44 w-[300px] h-[380px] bg-slate-900/90 backdrop-blur-xl rounded-xl flex flex-col overflow-hidden shadow-2xl z-10 border border-white/10">
        <div class="h-10 bg-slate-900/80 border-b border-white/10 flex items-center justify-between px-4 select-none cursor-move" onmousedown="startDrag(event, 'calcWindow')">
            <div class="flex items-center space-x-2">
                <div onclick="closeApp('calcWindow')" class="w-3 h-3 rounded-full bg-rose-500 cursor-pointer"></div>
                <span class="text-xs font-semibold text-slate-300 ml-2">Calculator</span>
            </div>
        </div>
        <div class="p-4 flex flex-col flex-1 bg-slate-950/40">
            <div id="calcDisplay" class="bg-slate-900 text-right text-2xl font-bold p-3 rounded-xl mb-3 text-white">0</div>
            <div class="grid grid-cols-4 gap-2 flex-1">
                <button onclick="calcClear()" class="bg-rose-600 rounded text-white font-bold">C</button>
                <button onclick="calcAppend('/')" class="bg-slate-800 rounded text-white font-bold">/</button>
                <button onclick="calcAppend('*')" class="bg-slate-800 rounded text-white font-bold">×</button>
                <button onclick="calcAppend('-')" class="bg-slate-800 rounded text-white font-bold">-</button>
                <button onclick="calcAppend('7')" class="bg-slate-700 rounded text-white font-bold">7</button>
                <button onclick="calcAppend('8')" class="bg-slate-700 rounded text-white font-bold">8</button>
                <button onclick="calcAppend('9')" class="bg-slate-700 rounded text-white font-bold">9</button>
                <button onclick="calcAppend('+')" class="bg-slate-800 rounded text-white font-bold row-span-2">+</button>
                <button onclick="calcAppend('4')" class="bg-slate-700 rounded text-white font-bold">4</button>
                <button onclick="calcAppend('5')" class="bg-slate-700 rounded text-white font-bold">5</button>
                <button onclick="calcAppend('6')" class="bg-slate-700 rounded text-white font-bold">6</button>
                <button onclick="calcAppend('1')" class="bg-slate-700 rounded text-white font-bold">1</button>
                <button onclick="calcAppend('2')" class="bg-slate-700 rounded text-white font-bold">2</button>
                <button onclick="calcAppend('3')" class="bg-slate-700 rounded text-white font-bold">3</button>
                <button onclick="calcCompute()" class="bg-blue-600 rounded text-white font-bold row-span-2">=</button>
                <button onclick="calcAppend('0')" class="bg-slate-700 rounded text-white font-bold col-span-2">0</button>
                <button onclick="calcAppend('.')" class="bg-slate-700 rounded text-white font-bold">.</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS WINDOW -->
    <div id="settingsWindow" class="window hidden absolute top-12 left-60 w-[550px] h-[380px] bg-slate-900/90 backdrop-blur-xl rounded-xl flex flex-col overflow-hidden shadow-2xl z-10 border border-white/10">
        <div class="h-10 bg-slate-900/80 border-b border-white/10 flex items-center justify-between px-4 select-none cursor-move" onmousedown="startDrag(event, 'settingsWindow')">
            <div class="flex items-center space-x-2">
                <div onclick="closeApp('settingsWindow')" class="w-3 h-3 rounded-full bg-rose-500 cursor-pointer"></div>
                <span class="text-xs font-semibold text-slate-300 ml-2">Settings</span>
            </div>
        </div>
        <div class="p-6 space-y-4">
            <h3 class="text-sm font-semibold">Change Wallpaper</h3>
            <div class="grid grid-cols-3 gap-3">
                <div onclick="setWallpaper('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop')" class="h-20 rounded-lg bg-cover bg-center cursor-pointer border border-indigo-500" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop')"></div>
                <div onclick="setWallpaper('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2000&auto=format&fit=crop')" class="h-20 rounded-lg bg-cover bg-center cursor-pointer border border-white/20" style="background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=400&auto=format&fit=crop')"></div>
                <div onclick="setWallpaper('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000&auto=format&fit=crop')" class="h-20 rounded-lg bg-cover bg-center cursor-pointer border border-white/20" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=400&auto=format&fit=crop')"></div>
            </div>
        </div>
    </div>

    <!-- Taskbar -->
    <div class="h-14 bg-slate-900/80 backdrop-blur-xl border-t border-white/10 flex items-center justify-between px-4 z-50">
        <button onclick="toggleStartMenu(event)" class="w-10 h-10 bg-indigo-600 hover:bg-indigo-500 rounded-xl flex items-center justify-center text-white transition-colors"><i class="fa-solid fa-cubes"></i></button>
        <div id="clock" class="text-xs font-medium bg-white/5 px-3 py-1.5 rounded-lg border border-white/5 text-slate-300"></div>
    </div>

    <!-- Main Desktop and Helper Script -->
    <script src="/desktop.js"></script>
    <script>
        // Ensure start menu helper functions exist so onclick events never fail
        function toggleStartMenu(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('startMenu');
            if (menu) {
                menu.classList.toggle('hidden');
            }
        }

        function closeStartMenu() {
            const menu = document.getElementById('startMenu');
            if (menu && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
